[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miosa"
version = "0.4.0"
description = "Python SDK for the MIOSA API — desktop infrastructure for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "MIOSA", email = "dev@miosa.ai" },
]
keywords = ["miosa", "ai", "agents", "desktop", "cloud", "vm", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.25.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
events = [
    "websockets>=11.0",
]
# Enable HTTP/2 transport (multiplexed TLS sessions, no per-call handshake
# tax). Without this extra the SDK still uses persistent HTTP/1.1 keep-alive
# — install with ``pip install miosa[http2]`` to opt into HTTP/2.
http2 = [
    "httpx[http2]>=0.25.0,<1.0.0",
    "h2>=4.0.0,<5.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "websockets>=11.0",
    "h2>=4.0.0,<5.0.0",
]

[project.urls]
Homepage = "https://miosa.ai"
Documentation = "https://docs.miosa.ai/sdk/python"
Repository = "https://github.com/robertohluna/miosa-python"

[tool.hatch.build.targets.wheel]
packages = ["miosa"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
